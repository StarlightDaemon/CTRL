name: Zero-Touch Localization

on:
  push:
    paths:
      - 'extension/src/public/_locales/en/messages.json' # Only trigger when source changes
    branches:
      - main

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push translations back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Locale Placeholders
        run: |
          # This script executes the diffing, API calls, and file writing
          node extension/scripts/translator/index.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0 (current target of the v5 tag)
        with:
          commit_message: "chore(i18n): auto-generate translations"
          file_pattern: 'extension/src/public/_locales/**/messages.json'
